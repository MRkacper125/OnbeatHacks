<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kabelki - OnbeatHacks</title>

    <link rel="stylesheet" href="./style.css?v=31">
</head>

<body>

    <div class="hack-panel">

        <div class="hack-header">
            <h2>Odpalanie pojazdu</h2>
            <p>Połącz pasujące przewody.</p>
        </div>

        <div class="settings-panel">

            <label>
                Czas
                <input
                    id="timeInput"
                    type="number"
                    min="5"
                    max="120"
                    value="15"
                >
                s
            </label>

            <label>
                Kabelki
                <input
                    id="wireCountInput"
                    type="number"
                    min="3"
                    max="12"
                    value="5"
                >
            </label>

            <button id="restartButton">
                RESTART
            </button>

        </div>

        <div class="game-area" id="gameArea">

            <canvas id="wireCanvas"></canvas>

            <div
                class="column left-column"
                id="leftColumn"
            ></div>

            <div
                class="column right-column"
                id="rightColumn"
            ></div>

        </div>

        <div class="timer-background">
            <div
                id="timerBar"
                class="timer-bar"
            ></div>
        </div>

        <div
            id="status"
            class="status"
        ></div>

    </div>

    <script src="./script.js?v=30"></script>

</body>

</html>
